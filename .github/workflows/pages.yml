name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .nojekyll
      - assets/**
      - images/**
      - videos/**
      - README.md
      - ATTRIBUTION.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Export website assets only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          git archive HEAD index.html .nojekyll assets images videos README.md ATTRIBUTION.md | tar -x -C _site
          test -f _site/index.html
          test ! -e _site/code
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
