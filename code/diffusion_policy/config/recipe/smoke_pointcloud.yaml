# @package _global_
dataloader:
  batch_size: 1
  num_workers: 0
  shuffle: true
  pin_memory: false
  persistent_workers: false

val_dataloader:
  batch_size: 1
  num_workers: 0
  shuffle: false
  pin_memory: false
  persistent_workers: false

training:
  resume: false
  freeze_encoder: false
  num_epochs: 1
  max_train_steps: 1
  max_val_steps: 1
  rollout_every: 1
  checkpoint_every: 100
  uint8_to_gpu: false
  enable_validation: true

checkpoint:
  topk:
    k: 0
  save_last_ckpt: false
