# @package _global_

shape_meta: ${task.shape_meta}
exp_name: default

# 输出按算法分目录。experiment 必须覆盖 output_group。
output_root: data/outputs
output_group: misc

n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: false
obs_as_global_cond: true

ema:
  _target_: diffusion_policy.model.common.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: cuda:0
  # hydra: instantiate optimizer below; model: use policy.optimizer;
  # policy_method: call policy.get_optimizer(**optimizer).
  optimizer_source: hydra
  seed: 42
  debug: false
  resume: true
  pretrained_model_path: null
  lr_scheduler: cosine
  lr_warmup_steps: 500
  gradient_accumulate_every: 1
  use_ema: true
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
  early_stopping:
    enabled: false
    monitor_key: test_mean_score
    threshold: 1.0
    patience: 3

logging:
  project: diffusion_policy_${task_name}
  resume: true
  mode: offline
  name: ${name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: epoch{epoch:03d}_score{test_mean_score:.4f}.ckpt
  save_last_ckpt: true
  save_last_snapshot: false

multi_run:
  run_dir: ${output_root}/${output_group}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: ${output_root}/${output_group}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: ${output_root}/${output_group}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
