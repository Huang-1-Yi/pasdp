# @package _global_
# Experiment A: PASDP native configuration. Also reused by B-PASDP and D-PASDP.
defaults:
  - /base: train_common
  - /workspace: padp
  - /task: robomimic/mimicgen_abs
  - /dataset: robomimic/replay_image_padp
  - /env_runner: robomimic/standard
  - /policy: padp_positionwise
  - /encoder: rgb/robomimic
  - /capacity: base
  - /temporal: padp_h40_obs1_action1
  - /recipe: padp_robomimic
  - /runtime: cuda
  - _self_

name: pasdp_a_native_h40_o1_a1_sample_${task_name}_seed${training.seed}
output_group: pasdp_experiment_a
task_name: coffee_d0
n_demo: 200
dataset_path: data/robomimic/datasets/${task_name}/${task_name}_abs.hdf5

policy:
  # Unified Robomimic RGB protocol: random 76x76 crop during training,
  # deterministic center crop during evaluation.
  crop_shape: [76, 76]

logging:
  project: pasdp_paper_${task_name}
  name: ${name}
  tags: [experiment_a, pasdp, native, sample]
