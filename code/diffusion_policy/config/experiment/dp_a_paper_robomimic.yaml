# @package _global_
# Experiment A: Diffusion Policy paper DDIM configuration.
defaults:
  - /base: train_common
  - /workspace: policy
  - /task: robomimic/mimicgen_abs
  - /dataset: robomimic/replay_image
  - /env_runner: robomimic/standard
  - /policy: dp_ddim
  - /encoder: rgb/robomimic_raw
  - /capacity: base
  - /temporal: dp_h16_obs2_action8
  - /recipe: dp_robomimic
  - /runtime: cuda
  - _self_

name: dp_a_paper_h16_o2_a8_t100_i10_epsilon_${task_name}_seed${training.seed}
output_group: pasdp_experiment_a
task_name: coffee_d0
n_demo: 200
dataset_path: data/robomimic/datasets/${task_name}/${task_name}_abs.hdf5

policy:
  crop_shape: [76, 76]
  noise_scheduler:
    num_train_timesteps: 100
    prediction_type: epsilon
  num_inference_steps: 10

logging:
  project: pasdp_paper_${task_name}
  name: ${name}
  tags: [experiment_a, dp, paper_ddim, epsilon]
