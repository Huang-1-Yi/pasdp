# @package task.env_runner

# 小显存烟雾测试配置：只用于确认数据、模型、训练和 rollout 链路可运行。
# 它减少评估数量和并发数，结果不能写入 standard 正式实验对比表。
_target_: diffusion_policy.envs.robomimic.robomimic_image_runner_padp.RobomimicImageRunner
dataset_path: ${dataset_path}
shape_meta: ${task.shape_meta}
n_train: 6
n_train_vis: 2
train_start_idx: 0
n_test: 18
n_test_vis: 2
test_start_seed: 100000
max_steps: ${get_max_steps:${task_name}}
n_obs_steps: ${n_obs_steps}
n_action_steps: ${n_action_steps}
render_obs_key: agentview_image
fps: 10
crf: 22
past_action: ${past_action_visible}
abs_action: ${task.abs_action}
tqdm_interval_sec: 1.0
n_envs: 12
debug_check_actions: ${training.debug}
